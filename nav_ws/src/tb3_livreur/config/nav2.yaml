# Paramètres Nav2 pour le TurtleBot3 Burger dans l'atelier MecaTri.
# Référence : nav2_bringup/params/nav2_params.yaml (Humble), adapté au Burger :
#   - rayon englobant 0,12 m (châssis 138 x 178 mm -> demi-diagonale 0,113 m + marge)
#   - vitesses maximales 0,22 m/s et 2,84 rad/s (fiche ROBOTIS)
#   - lidar LDS-01 : portée 3,5 m
#   - repère du robot : base_footprint ; pas d'horloge simulée (use_sim_time: false)

# ====================== Orchestration : l'action /navigate_to_pose ======================
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 20
    # Délai (ms) accordé aux serveurs pour accuser réception d'un but ou d'un service.
    # La valeur Nav2 par défaut (20 ms) est trop courte sous Windows : le BT croit à un échec,
    # déclenche des reprises et finit par abandonner un but pourtant en cours.
    default_server_timeout: 500
    wait_for_service_timeout: 1000
    # Behavior tree par défaut : navigate_to_pose_w_replanning_and_recovery.xml
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false

# ====================== Suivi du chemin : le contrôleur (DWB) ======================
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    # Le robot progresse-t-il ? (sinon le BT déclenche une reprise)
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.3   # m : le robot doit avoir bougé d'autant...
      movement_time_allowance: 15.0   # ... en ce temps (s), sinon le BT tente une reprise
    # Est-on arrivé ? Le but est atteint quand le robot est à moins de xy_goal_tolerance (m)
    # du but ET orienté à moins de yaw_goal_tolerance (rad). Trop grand : le robot s'arrête
    # loin du poste. Trop petit : plus fin que la précision de la localisation (quelques cm,
    # quelques degrés), le robot oscille autour du but sans jamais le valider.
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.0        # >>> À COMPLÉTER 7 : tolérance d'arrivée en position (m)
      yaw_goal_tolerance: 0.0       # >>> À COMPLÉTER 7 : tolérance d'arrivée en orientation (rad)
      stateful: true
    # DWB : échantillonne des vitesses, simule des trajectoires courtes, note avec des critics
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      debug_trajectory_details: true
      min_vel_x: 0.0
      min_vel_y: 0.0
      # Vitesses maximales : DWB ne simule que des trajectoires dans ces limites. Au-delà de
      # ce que le robot peut faire, il prévoit des trajectoires que le robot ne suivra pas.
      max_vel_x: 0.0           # >>> À COMPLÉTER 7 : vitesse linéaire maximale du Burger (m/s)
      max_vel_y: 0.0           # robot différentiel : pas de translation latérale
      max_vel_theta: 0.0       # >>> À COMPLÉTER 7 : vitesse angulaire maximale du Burger (rad/s)
      min_speed_xy: 0.0
      max_speed_xy: 0.0        # >>> À COMPLÉTER 7 : comme max_vel_x
      min_speed_theta: 0.0
      acc_lim_x: 2.5
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.0   # >>> À COMPLÉTER 7 : la même que celle du goal_checker
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

# ====================== Costmap locale : fenêtre roulante autour du robot ======================
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      # Deux repères à ne pas confondre :
      #  - global_frame : le repère dans lequel la grille est FIXÉE (où sont les cellules) ;
      #  - robot_base_frame : le repère du robot, qui sert à centrer la fenêtre.
      # Avec rolling_window, la fenêtre de 3 m suit le robot (elle se recentre sur
      # robot_base_frame), mais les obstacles restent fixés dans global_frame : quand le
      # robot tourne, la grille ne tourne pas avec lui.
      global_frame: A_COMPLETER     # >>> À COMPLÉTER 7 : un repère fixe dans la salle à court
                                    #     terme et continu (sans saut quand AMCL corrige)
      robot_base_frame: A_COMPLETER # >>> À COMPLÉTER 7 : le repère du robot au sol
      rolling_window: true
      width: 3                      # m
      height: 3                     # m
      resolution: 0.05
      # robot_radius : rayon du cercle qui englobe le robot. Les cellules à moins de ce rayon
      # d'un obstacle sont LÉTALES : le centre du robot n'y va jamais (contrainte).
      robot_radius: 0.0             # >>> À COMPLÉTER 7 : rayon du cercle englobant le Burger (m), voir Q16
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan   # nom libre d'une source ; ses réglages suivent
        scan:
          topic: A_COMPLETER        # >>> À COMPLÉTER 7 : le topic du lidar
          max_obstacle_height: 2.0
          clearing: true            # les rayons libèrent les cellules traversées
          marking: true             # les impacts marquent des obstacles
          data_type: LaserScan
          raytrace_max_range: 3.5
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
      # Inflation : autour de la zone létale, un coût qui décroît avec la distance, jusqu'à
      # inflation_radius (m) de l'obstacle. Le robot PRÉFÈRE passer loin des murs, sans
      # interdiction (préférence). Doit être plus grand que robot_radius pour servir à
      # quelque chose ; trop grand, les couloirs deviennent chers et le robot fait des détours.
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.0         # >>> À COMPLÉTER 7 : portée du coût (m) : 2 à 3 fois robot_radius
      always_send_full_costmap: true

# ====================== Costmap globale : toute la carte ======================
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      # Toute la carte, fixée dans le repère de la carte : c'est sur elle que le planificateur
      # cherche un chemin vers un but donné dans la salle.
      global_frame: A_COMPLETER     # >>> À COMPLÉTER 7 : le repère de la carte
      robot_base_frame: A_COMPLETER # >>> À COMPLÉTER 7
      robot_radius: 0.0             # >>> À COMPLÉTER 7 : comme la costmap locale
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: A_COMPLETER        # >>> À COMPLÉTER 7 : le topic du lidar
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 3.5
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.0       # >>> À COMPLÉTER 7 : même valeur que la costmap locale
      always_send_full_costmap: true

# ====================== Planification globale ======================
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.5
      use_astar: false              # false : Dijkstra ; true : A*
      allow_unknown: true           # autorise un chemin à travers l'inconnu

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

# ====================== Comportements de reprise ======================
behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200

# ====================== Lissage des vitesses, juste avant le robot ======================
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    # Dernier filtre avant /cmd_vel : il écrête les vitesses du contrôleur à ces limites
    # [vx, vy, vθ] et limite les accélérations. vy = 0 : un robot différentiel ne se
    # déplace pas de côté.
    max_velocity: [0.0, 0.0, 0.0]    # >>> À COMPLÉTER 7 : [vx, vy, vtheta] maximales du Burger
    min_velocity: [0.0, 0.0, 0.0]    # >>> À COMPLÉTER 7 : les mêmes, négatives
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
