# Paramètres d'AMCL (Adaptive Monte Carlo Localization) pour le TurtleBot3 Burger.
# Référence : nav2_bringup/params/nav2_params.yaml et docs.nav2.org (configuring-amcl).
amcl:
  ros__parameters:
    use_sim_time: false

    # --- Repères et topics ---
    base_frame_id: A_COMPLETER      # >>> À COMPLÉTER 6 : le repère du robot
    odom_frame_id: A_COMPLETER      # >>> À COMPLÉTER 6 : le repère de l'odométrie
    global_frame_id: A_COMPLETER    # >>> À COMPLÉTER 6 : le repère de la carte
    scan_topic: A_COMPLETER         # >>> À COMPLÉTER 6
    tf_broadcast: true              # false : AMCL estime mais ne publie pas map -> odom
    transform_tolerance: 1.0

    # --- Modèle du lidar ---
    laser_model_type: likelihood_field
    laser_max_range: 0.0            # >>> À COMPLÉTER 6 : portée du LDS-01 (m)
    laser_min_range: -1.0           # -1 : utiliser range_min du message
    max_beams: 60                   # rayons utilisés par mise à jour (sur 360)
    laser_likelihood_max_dist: 2.0
    sigma_hit: 0.2
    z_hit: 0.5
    z_rand: 0.5
    z_max: 0.05
    z_short: 0.05
    lambda_short: 0.1
    do_beamskip: false

    # --- Filtre à particules ---
    min_particles: 0                # >>> À COMPLÉTER 6 : quelques centaines
    max_particles: 0                # >>> À COMPLÉTER 6 : quelques milliers
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_slow: 0.0        # > 0 : injecte des particules aléatoires si l'estimation
    recovery_alpha_fast: 0.0        #       se dégrade (aide à retrouver un robot kidnappé)

    # --- Modèle de mouvement (odométrie différentielle) et déclenchement des mises à jour ---
    robot_model_type: nav2_amcl::DifferentialMotionModel
    alpha1: 0.2                     # bruit de rotation dû à la rotation
    alpha2: 0.2                     # bruit de rotation dû à la translation
    alpha3: 0.2                     # bruit de translation dû à la translation
    alpha4: 0.2                     # bruit de translation dû à la rotation
    alpha5: 0.2
    update_min_d: 0.0               # >>> À COMPLÉTER 6 : mise à jour après N m parcourus...
    update_min_a: 0.0               # >>> À COMPLÉTER 6 : ... ou N rad tournés

    # --- Pose initiale : donnée dans RViz (topic /initialpose) ---
    set_initial_pose: false
    initial_pose: {x: 0.0, y: 0.0, z: 0.0, yaw: 0.0}
    save_pose_rate: 0.5
    always_reset_initial_pose: false
    first_map_only: false
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
