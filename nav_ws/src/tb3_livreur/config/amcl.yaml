# Paramètres d'AMCL (Adaptive Monte Carlo Localization) pour le TurtleBot3 Burger.
# Référence : nav2_bringup/params/nav2_params.yaml et docs.nav2.org (configuring-amcl).
amcl:
  ros__parameters:
    use_sim_time: false

    # --- Repères et topics ---
    base_frame_id: base_footprint   # le robot
    odom_frame_id: odom             # publié par l'odométrie
    global_frame_id: map            # la carte ; AMCL publie map -> odom
    scan_topic: scan
    tf_broadcast: true              # false : AMCL estime mais ne publie pas map -> odom
    transform_tolerance: 1.0

    # --- Modèle du lidar ---
    laser_model_type: likelihood_field
    laser_max_range: 3.5            # portée du LDS-01
    laser_min_range: -1.0           # -1 : utiliser range_min du message
    max_beams: 60                   # rayons utilisés par mise à jour (sur 360)
    laser_likelihood_max_dist: 2.0
    sigma_hit: 0.2
    z_hit: 0.5
    z_rand: 0.5
    z_max: 0.05
    z_short: 0.05
    lambda_short: 0.1
    do_beamskip: false

    # --- Filtre à particules ---
    # Une particule = une hypothèse de pose (x, y, θ) du robot dans la carte. À chaque mise
    # à jour, AMCL :
    #   1. PRÉDIT : déplace chaque particule du mouvement mesuré par l'odométrie, plus un
    #      bruit tiré au hasard (modèle de mouvement, alpha1..alpha4 ci-dessous) ;
    #   2. PONDÈRE : compare le scan, vu depuis chaque particule, aux murs de la carte ;
    #      une particule dont le scan « tombe » sur les murs reçoit un poids élevé ;
    #   3. RÉÉCHANTILLONNE : tire un nouveau nuage où les particules lourdes sont dupliquées
    #      et les légères disparaissent.
    # Le nombre de particules s'adapte (« Adaptive » MCL, échantillonnage KLD) entre
    # min_particles, quand le nuage est concentré, et max_particles, quand il est étalé
    # (juste après la pose initiale, après une relocalisation globale).
    # Trop peu : la bonne pose peut ne pas être représentée. Trop : du calcul pour rien.
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05                    # KLD : erreur tolérée sur la distribution estimée...
    pf_z: 0.99                      # ... avec cette confiance (plus exigeant = plus de particules)
    resample_interval: 1            # rééchantillonner toutes les N mises à jour
    recovery_alpha_slow: 0.0        # > 0 : injecte des particules aléatoires si l'estimation
    recovery_alpha_fast: 0.0        #       se dégrade (aide à retrouver un robot kidnappé, déplacé sans prévenir AMCL)

    # --- Modèle de mouvement (odométrie différentielle) ---
    # L'odométrie n'est pas parfaite (partie 2) : à l'étape PRÉDIT, AMCL ajoute à chaque
    # particule un bruit proportionnel au mouvement. Plus un alpha est grand, plus le nuage
    # s'étale à chaque déplacement : AMCL fait moins confiance à l'odométrie, et compte
    # davantage sur le scan pour resserrer le nuage.
    robot_model_type: nav2_amcl::DifferentialMotionModel
    alpha1: 0.2                     # bruit sur la rotation, dû aux rotations
    alpha2: 0.2                     # bruit sur la rotation, dû aux translations
    alpha3: 0.2                     # bruit sur la translation, dû aux translations
    alpha4: 0.2                     # bruit sur la translation, dû aux rotations
    alpha5: 0.2                     # utilisé seulement par le modèle omnidirectionnel

    # --- Déclenchement des mises à jour ---
    # AMCL ne fait une mise à jour (prédire, pondérer, rééchantillonner) qu'après un
    # déplacement minimal. Trop petit : beaucoup de calcul, et à l'arrêt le
    # rééchantillonnage répété appauvrit le nuage. Trop grand : corrections rares,
    # l'erreur de l'odométrie a le temps de s'accumuler entre deux.
    update_min_d: 0.2               # mise à jour après 20 cm parcourus...
    update_min_a: 0.2               # ... ou 0,2 rad tournés

    # --- Pose initiale : donnée dans RViz (topic /initialpose) ---
    set_initial_pose: false
    initial_pose: {x: 0.0, y: 0.0, z: 0.0, yaw: 0.0}
    save_pose_rate: 0.5
    always_reset_initial_pose: false
    first_map_only: false
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
